            hour: '2-digit',

            const diffMin = (targetMin - totalMinutes + 1440) % 1440;

            const m = diffMin % 60;
            const s = 59 - now.getSeconds();
            setCountdownText(`${String(h).padStart(2, '0')}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`);
